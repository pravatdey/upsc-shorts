# ============================================================================
# TOPIC BANK
#
# Each entry becomes exactly one Short. Topics are consumed in order, spread
# across categories so the three Shorts posted each morning look different from
# one another. Used ids are recorded in progress.json and never repeat until
# the whole bank has been cycled.
#
# At 3 Shorts/day this bank lasts roughly two months. To extend it, just append
# more entries — no code change needed.
#
# Fields:
#   id       unique, stable. Changing it makes the topic look unused again.
#   title    what the Short is about. The script writer rewrites this into the
#            actual video title, so plain English is fine here.
#   category drives the accent colour, hashtags and tags. Must be one of:
#            geopolitics, international_relations, polity, economy, environment,
#            history, geography, science_tech, schemes, current_affairs
#   angle    the hook. This is the most important field — it is what separates
#            "explain the Siachen Glacier" from "why India spends crores to hold
#            a glacier where no one lives".
#   keywords search terms; feed the tags and hashtags.
# ============================================================================

